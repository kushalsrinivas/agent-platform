[project]
name = "agent-platform-runtime"
version = "0.1.0"
description = "Python execution runtime for the Agent Platform: agent loops, model providers, tools, MCP and checkpoints."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "langgraph>=1.0",
    "pydantic>=2.10",
    "rfc8785>=0.1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/agent_runtime",
    "src/checkpointing",
    "src/contracts",
    "src/mcp",
    "src/model_providers",
    "src/tool_runtime",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unused_ignores = true
# LangGraph ships incomplete type information in a few places.
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"

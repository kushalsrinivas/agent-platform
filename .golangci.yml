version: "2"

run:
  timeout: 5m
  build-tags:
    - integration

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - revive
    - unconvert
  exclusions:
    generated: lax
    paths:
      - gen
      - third_party
    rules:
      # Internal API packages intentionally do not carry a doc comment on every handler and store method.
      - path: services/api/internal/
        linters:
          - revive
        text: "^exported:"

formatters:
  enable:
    - gofmt
    - goimports

version: "2"

run:
  timeout: 5m
  build-tags:
    - integration

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - revive
    - unconvert
  exclusions:
    generated: lax
    paths:
      - gen
      - third_party

formatters:
  enable:
    - gofmt
    - goimports

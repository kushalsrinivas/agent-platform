openapi: 3.1.0
info:
  title: Agent Platform API
  version: 1.1.0
  summary: External REST and SSE contract for the agent platform.
  description: |
    Normative public API contract. `/api/v1` is the canonical prefix; `/v1` is a compatibility alias with the same
    resources. `/api/v1/organizations` is an alias for `/v1/orgs`.

    **Authentication.** Programmatic clients send `Authorization: Bearer <OIDC JWT>` or an API key via
    `X-API-Key: apk_...` (or `Authorization: Bearer apk_...`). API keys are project-scoped or organisation-scoped,
    carry a role, and are revoked immediately. The server derives the caller's organisations from membership rows;
    an `org_id` in a path is verified, never trusted.

    **Development authentication.** When the API runs with `AUTH_MODE=dev` (local development only),
    `POST /api/v1/dev/token` issues a short-lived bearer token for a principal. That endpoint is never mounted in
    OIDC mode; it is not part of the production contract.

    **Tenancy.** Every path below includes the organisation. Cross-tenant IDs return `404`, not `403`, to avoid
    leaking existence.

    **Idempotency.** `POST .../executions` requires `Idempotency-Key`. Repeating the same key with the same body
    returns the original execution with `202`; a different body with the same key returns `409`.

    **Execution state is server state.** This API never exposes a "set state" operation. Cancellation is the only
    execution transition a caller may request. State changes arrive via SSE or polling.

    **Versioning.** `/api/v1` is additive-only. Breaking changes move to `/v2`. The `/v1` alias remains for
    compatibility.

    **Pagination, filtering, sorting.** List endpoints accept `limit` and an opaque `cursor`. Executions accept
    `state`, `workflow_id`, `created_after`, `created_before` and `sort=created_at_desc|created_at_asc`.

    **Errors.** Every non-2xx response is `{"error":{"code","message","details?","request_id"}}`.

    **Rate limits.** Authenticated requests are rate-limited per caller; `429` responses honour `Retry-After`.
  contact:
    name: Platform Team
  license:
    name: Proprietary
    identifier: UNLICENSED
servers:
  - url: https://api.example.com
    description: Production
  - url: http://localhost:8080
    description: Local development
security:
  - oidcBearer: []
  - apiKey: []
tags:
  - name: Organizations
    description: Organisations the caller belongs to. Authenticated users may create an organisation and become its owner; platform operators can also provision them.
  - name: Projects
    description: Projects within an organisation.
  - name: Agents
    description: Agent definitions and immutable versions.
  - name: Workflows
    description: Workflow graphs and immutable published versions.
  - name: Executions
    description: Execution submission, state, tasks and live events.
  - name: Workers
    description: Platform-operator view of the worker fleet. Requires the identity provider's platform-operator role, not an organisation membership.
  - name: Credentials
    description: Write-only project credentials referenced by agent versions.
paths:
  /api/v1/orgs:
    get:
      tags: [Organizations]
      operationId: listOrganizations
      summary: List organisations the caller belongs to.
      responses:
        '200':
          description: Organisations visible to the caller.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Organization' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      tags: [Organizations]
      operationId: createOrganization
      summary: Create an organisation. The caller becomes its first owner.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationCreate' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/orgs/{org_id}/members:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      tags: [Organizations]
      operationId: listMembers
      summary: List organisation members.
      responses:
        '200':
          description: Members.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Member' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Organizations]
      operationId: addMember
      summary: Add a member by principal ID. Owner only.
      description: Invitation email flows are deferred; the principal must already exist at the identity provider.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemberCreate' }
      responses:
        '201':
          description: Member added.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/v1/orgs/{org_id}/members/{principal_id}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/PrincipalId'
    patch:
      tags: [Organizations]
      operationId: updateMemberRole
      summary: Change a member role. Owner only; the last owner cannot be demoted.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemberUpdate' }
      responses:
        '200':
          description: Updated member.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      tags: [Organizations]
      operationId: removeMember
      summary: Remove a member. Owner only; the last owner cannot be removed.
      responses:
        '204': { description: Removed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/orgs/{org_id}/projects:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      tags: [Projects]
      operationId: listProjects
      summary: List projects in an organisation.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Projects.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Project' }
                  next_cursor:
                    type: [string, 'null']
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      tags: [Projects]
      operationId: createProject
      summary: Create a project.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectCreate' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/orgs/{org_id}/projects/{project_id}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      operationId: getProject
      summary: Get a project.
      responses:
        '200':
          description: Project.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/orgs/{org_id}/projects/{project_id}/agents:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Agents]
      operationId: listAgents
      summary: List agents.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Agents.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Agent' }
                  next_cursor:
                    type: [string, 'null']
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Agents]
      operationId: createAgent
      summary: Create an agent with an initial draft version.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentCreate' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/v1/orgs/{org_id}/projects/{project_id}/agents/{agent_id}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/AgentId'
    get:
      tags: [Agents]
      operationId: getAgent
      summary: Get an agent.
      responses:
        '200':
          description: Agent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/orgs/{org_id}/projects/{project_id}/agents/{agent_id}/versions:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/AgentId'
    get:
      tags: [Agents]
      operationId: listAgentVersions
      summary: List versions, newest first.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Versions.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AgentVersion' }
                  next_cursor:
                    type: [string, 'null']
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Agents]
      operationId: createAgentVersion
      summary: Create an immutable agent version.
      description: |
        Versions are insert-only. A version may be created as `draft`, then published once; content is immutable
        from creation. Editing an agent requires creating a new version. `runtime.image_digest` must be a digest,
        not a tag.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentVersionCreate' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentVersion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/v1/orgs/{org_id}/projects/{project_id}/agents/{agent_id}/versions/{version}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/AgentId'
      - $ref: '#/components/parameters/VersionInt'
    get:
      tags: [Agents]
      operationId: getAgentVersion
      summary: Get one agent version.
      responses:
        '200':
          description: Version.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentVersion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/orgs/{org_id}/projects/{project_id}/agents/{agent_id}/versions/{version}:publish:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/AgentId'
      - $ref: '#/components/parameters/VersionInt'
    post:
      tags: [Agents]
      operationId: publishAgentVersion
      summary: Publish a draft agent version.
      description: One-way `draft -> published`. Repeating on a published version returns `200` unchanged.
      responses:
        '200':
          description: Published version.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentVersion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/v1/orgs/{org_id}/projects/{project_id}/workflows:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Workflows]
      operationId: listWorkflows
      summary: List workflows.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Workflows.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Workflow' }
                  next_cursor:
                    type: [string, 'null']
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Workflows]
      operationId: createWorkflow
      summary: Create a workflow with an initial draft version.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkflowCreate' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workflow' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/v1/orgs/{org_id}/projects/{project_id}/workflows/{workflow_id}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/WorkflowId'
    get:
      tags: [Workflows]
      operationId: getWorkflow
      summary: Get a workflow.
      responses:
        '200':
          description: Workflow.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workflow' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/orgs/{org_id}/projects/{project_id}/workflows/{workflow_id}/versions:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/WorkflowId'
    get:
      tags: [Workflows]
      operationId: listWorkflowVersions
      summary: List versions, newest first.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Versions.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/WorkflowVersion' }
                  next_cursor:
                    type: [string, 'null']
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Workflows]
      operationId: createWorkflowVersion
      summary: Create an immutable draft workflow version.
      description: |
        Validates the DAG, compiles every CEL `when` expression, resolves exact agent/tool versions and their
        runtime ABIs. Reference IDs are exact; `latest` is not accepted. A failed validation changes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkflowVersionCreate' }
      responses:
        '201':
          description: Created draft.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowVersion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/v1/orgs/{org_id}/projects/{project_id}/workflows/{workflow_id}/versions/{version}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/WorkflowId'
      - $ref: '#/components/parameters/VersionInt'
    get:
      tags: [Workflows]
      operationId: getWorkflowVersion
      summary: Get one workflow version.
      responses:
        '200':
          description: Version.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowVersion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/orgs/{org_id}/projects/{project_id}/workflows/{workflow_id}/versions/{version}:publish:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/WorkflowId'
      - $ref: '#/components/parameters/VersionInt'
    post:
      tags: [Workflows]
      operationId: publishWorkflowVersion
      summary: Publish a draft workflow version.
      description: |
        One-way `draft -> published`. All referenced agent/tool versions must be published (not deprecated). Once
        published, the graph is immutable and can be used to start executions. Publishing also sets the workflow's
        `deployed_version`; repeating on an older published version rolls the deployment pointer back and returns
        `200`.
      responses:
        '200':
          description: Published version.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowVersion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/v1/orgs/{org_id}/projects/{project_id}/executions:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [Executions]
      operationId: createExecution
      summary: Start an execution of a published workflow version.
      description: |
        Commits the execution, materialised tasks and outbox before responding. `202` means accepted, not
        finished. The `Idempotency-Key` is required; reuse with an identical body returns the same execution.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExecutionCreate' }
      responses:
        '202':
          description: Accepted and durably committed.
          headers:
            Location:
              description: Canonical execution URL.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Execution' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Idempotency key reuse with a different body.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
    get:
      tags: [Executions]
      operationId: listExecutions
      summary: List executions, newest first.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: state
          in: query
          description: Filter by execution state.
          schema: { $ref: '#/components/schemas/ExecutionState' }
        - name: workflow_id
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Executions summary list.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Execution' }
                  next_cursor:
                    type: [string, 'null']
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/orgs/{org_id}/projects/{project_id}/executions/{execution_id}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ExecutionId'
    get:
      tags: [Executions]
      operationId: getExecution
      summary: Get execution state and counts.
      responses:
        '200':
          description: Execution.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Execution' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/orgs/{org_id}/projects/{project_id}/executions/{execution_id}:cancel:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ExecutionId'
    post:
      tags: [Executions]
      operationId: cancelExecution
      summary: Request cancellation.
      description: |
        Idempotent while the execution is `pending`, `running`, `cancel_requested` or `cancelled`. Returns `409`
        for `succeeded`, `failed` and `failing`. Cancellation is best effort: external side effects may already
        have occurred. The execution ends `cancelled` when all tasks are terminal.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 500
      responses:
        '202':
          description: Cancellation accepted or already in effect.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Execution' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/orgs/{org_id}/projects/{project_id}/executions/{execution_id}/input:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ExecutionId'
    get:
      tags: [Executions]
      operationId: getExecutionInput
      summary: Read the immutable input submitted for an execution.
      responses:
        '200':
          description: The original input object.
          content:
            application/json:
              schema:
                type: object
                required: [input]
                properties:
                  input: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/orgs/{org_id}/projects/{project_id}/executions/{execution_id}/replay:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ExecutionId'
    get:
      tags: [Executions]
      operationId: replayExecutionHistory
      summary: Reconstruct the durable history without re-executing anything.
      responses:
        '200':
          description: Execution, tasks, events and recorded outputs.
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/orgs/{org_id}/projects/{project_id}/executions/{execution_id}:replay:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ExecutionId'
    post:
      tags: [Executions]
      operationId: reexecuteExecution
      summary: Create a new execution from prior input and explicitly reused outputs.
      description: Requires Idempotency-Key. Reused outputs seed their nodes as succeeded; no external operation is repeated.
      responses:
        '202':
          description: Re-execution accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Execution' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/v1/orgs/{org_id}/projects/{project_id}/executions/{execution_id}/tasks/{task_id}:approve:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ExecutionId'
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [Executions]
      operationId: approveTask
      summary: Approve a waiting approval node.
      responses:
        '202': { description: Approval recorded. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/orgs/{org_id}/projects/{project_id}/executions/{execution_id}/tasks/{task_id}:reject:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ExecutionId'
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [Executions]
      operationId: rejectTask
      summary: Reject a waiting approval node.
      responses:
        '202': { description: Rejection recorded. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/orgs/{org_id}/projects/{project_id}/executions/{execution_id}/tasks/{task_id}:signal:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ExecutionId'
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [Executions]
      operationId: signalTask
      summary: Deliver an external payload to a waiting delay node.
      responses:
        '202': { description: Signal recorded. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/orgs/{org_id}/projects/{project_id}/executions/{execution_id}/tasks:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ExecutionId'
    get:
      tags: [Executions]
      operationId: listExecutionTasks
      summary: List tasks of an execution.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: state
          in: query
          schema: { $ref: '#/components/schemas/TaskState' }
      responses:
        '200':
          description: Tasks.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Task' }
                  next_cursor:
                    type: [string, 'null']
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/orgs/{org_id}/projects/{project_id}/executions/{execution_id}/tasks/{task_id}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ExecutionId'
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Executions]
      operationId: getExecutionTask
      summary: Get a task with its attempt history.
      responses:
        '200':
          description: Task with attempts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/orgs/{org_id}/projects/{project_id}/executions/{execution_id}/events:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ExecutionId'
    get:
      tags: [Executions]
      operationId: listExecutionEvents
      summary: Read the audit event history.
      description: Ascending by `seq`. Use `after` for catch-up after an SSE reconnect.
      parameters:
        - name: after
          in: query
          description: Return events with `seq` greater than this value.
          schema: { type: integer, minimum: 0, default: 0 }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Events.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Event' }
                  next_cursor:
                    type: [string, 'null']
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/orgs/{org_id}/projects/{project_id}/executions/{execution_id}/delegations:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ExecutionId'
    get:
      tags: [Executions]
      operationId: listExecutionDelegations
      summary: List supervisor-to-child delegations in the execution hierarchy.
      responses:
        '200':
          description: Delegations, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Delegation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/orgs/{org_id}/projects/{project_id}/executions/{execution_id}/approvals:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ExecutionId'
    get:
      tags: [Executions]
      operationId: listExecutionApprovals
      summary: List human approval records and their decision audit trail.
      responses:
        '200':
          description: Approval records, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Approval' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/orgs/{org_id}/projects/{project_id}/executions/{execution_id}/stream:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ExecutionId'
    get:
      tags: [Executions]
      operationId: streamExecution
      summary: Stream live execution events (SSE).
      description: |
        `text/event-stream`. Each event's `id` is the execution event `seq`. `event` is one of
        `execution.created`, `execution.state_changed`, `task.state_changed`, `task.attempt_finished`.
        `data` is a JSON object including `seq`. Reconnect with `Last-Event-ID`; clients must dedupe duplicate IDs.
        The server sends a heartbeat comment every 15 seconds and closes the connection after 30 minutes.
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          description: Last processed event sequence, for replay.
          schema: { type: string }
      responses:
        '200':
          description: Event stream.
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE frames.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/orgs/{org_id}/projects/{project_id}/credentials:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Credentials]
      operationId: listCredentials
      summary: List credential names (values are never returned).
      responses:
        '200':
          description: Credential metadata.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Credential' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Credentials]
      operationId: createCredential
      summary: Create or rotate a write-only credential.
      description: Value is encrypted server-side and never readable through any API.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CredentialCreate' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Credential' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/v1/orgs/{org_id}/projects/{project_id}/credentials/{name}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
      - name: name
        in: path
        required: true
        schema: { type: string, pattern: '^[a-z][a-z0-9_-]{0,63}$' }
    delete:
      tags: [Credentials]
      operationId: deleteCredential
      summary: Delete a credential. Fails if a published agent version references it.
      responses:
        '204':
          description: Deleted.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/workers:
    get:
      tags: [Workers]
      operationId: listWorkers
      summary: List workers in the fleet (platform operators).
      description: Not tenant-scoped. Requires the platform operator role.
      parameters:
        - name: pool
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/WorkerStatus' }
      responses:
        '200':
          description: Workers.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Worker' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/workers/{worker_id}:drain:
    parameters:
      - name: worker_id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Workers]
      operationId: drainWorker
      summary: Stop assigning new attempts and finish current ones.
      description: Platform operator only. Idempotent.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        '202':
          description: Drain requested.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Worker' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/orgs/{org_id}/api-keys:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      tags: [API Keys]
      operationId: listAPIKeys
      summary: List API key metadata. Owner only.
      responses:
        '200':
          description: API keys without secret material.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/APIKey' }
                  next_cursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [API Keys]
      operationId: createAPIKey
      summary: Create an API key. The plaintext key is returned once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                project_id: { type: string, pattern: '^proj_' }
                role: { type: string, enum: [viewer, operator, owner], default: operator }
                expires_at: { type: string, format: date-time }
      responses:
        '201':
          description: Created key. Store `key` now; it cannot be retrieved again.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/APIKey' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/v1/orgs/{org_id}/api-keys/{key_id}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - name: key_id
        in: path
        required: true
        schema: { type: string, pattern: '^key_' }
    delete:
      tags: [API Keys]
      operationId: revokeAPIKey
      summary: Revoke an API key immediately. Owner only.
      responses:
        '200':
          description: Revoked key metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/APIKey' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/orgs/{org_id}/workers:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      tags: [Workers]
      operationId: listOrganizationWorkers
      summary: List worker fleet capacity and health.
      parameters:
        - name: pool
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [starting, available, busy, draining, unhealthy, terminated] }
      responses:
        '200':
          description: Workers.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Worker' }
                  next_cursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/orgs/{org_id}/usage:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      tags: [Usage]
      operationId: getUsage
      summary: Aggregate executions, attempts, tokens and duration.
      parameters:
        - name: project_id
          in: query
          schema: { type: string, pattern: '^proj_' }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Usage summary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/v1/orgs/{org_id}/approvals:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      tags: [Approvals]
      operationId: listApprovals
      summary: List human approvals across the organisation.
      parameters:
        - name: project_id
          in: query
          schema: { type: string, pattern: '^proj_' }
        - name: status
          in: query
          schema: { type: string, enum: [pending, approved, rejected, expired] }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Approvals.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Approval' }
                  next_cursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/orgs/{org_id}/projects/{project_id}/environments:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Environments]
      operationId: listEnvironments
      summary: List project environment labels.
      responses:
        '200':
          description: Environments.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Environment' }
                  next_cursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Environments]
      operationId: createEnvironment
      summary: Create a project environment label.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                slug: { type: string, pattern: '^[a-z][a-z0-9-]{1,62}$' }
                kind: { type: string, enum: [development, staging, production], default: development }
      responses:
        '201':
          description: Environment created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Environment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/v1/orgs/{org_id}/projects/{project_id}/environments/{environment_id}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
      - name: environment_id
        in: path
        required: true
        schema: { type: string, pattern: '^env_' }
    get:
      tags: [Environments]
      operationId: getEnvironment
      summary: Get one environment.
      responses:
        '200':
          description: Environment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Environment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/orgs/{org_id}/projects/{project_id}/tools:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Tools]
      operationId: listTools
      summary: List built-in tools available in the runtime image.
      responses:
        '200':
          description: Tools.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Tool' }
                  next_cursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/orgs/{org_id}/projects/{project_id}/mcp/servers:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [MCP]
      operationId: listMCPServers
      summary: List MCP servers pinned by published agent versions.
      responses:
        '200':
          description: MCP server registry view.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/MCPServerView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/orgs/{org_id}/projects/{project_id}/workflows:validate:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [Workflows]
      operationId: validateWorkflow
      summary: Validate a workflow graph without storing it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [graph]
              properties:
                graph: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Valid graph.
          content:
            application/json:
              schema:
                type: object
                required: [valid, nodes, edges]
                properties:
                  valid: { type: boolean }
                  nodes: { type: integer }
                  edges: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/v1/orgs/{org_id}/projects/{project_id}/executions/{execution_id}:resume:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ExecutionId'
    post:
      tags: [Executions]
      operationId: resumeExecution
      summary: Re-run a failed or cancelled execution, reusing successful node outputs.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                priority: { type: integer, minimum: -100, maximum: 100 }
      responses:
        '202':
          description: Resume accepted as a new execution.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Execution' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
components:
  securitySchemes:
    oidcBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    OrgId:
      name: org_id
      in: path
      required: true
      schema: { type: string, pattern: '^org_' }
    ProjectId:
      name: project_id
      in: path
      required: true
      schema: { type: string, pattern: '^proj_' }
    AgentId:
      name: agent_id
      in: path
      required: true
      schema: { type: string, pattern: '^agt_' }
    WorkflowId:
      name: workflow_id
      in: path
      required: true
      schema: { type: string, pattern: '^wf_' }
    ExecutionId:
      name: execution_id
      in: path
      required: true
      schema: { type: string, pattern: '^exec_' }
    TaskId:
      name: task_id
      in: path
      required: true
      schema: { type: string, pattern: '^task_' }
    VersionInt:
      name: version
      in: path
      required: true
      description: Monotonic integer version.
      schema: { type: integer, minimum: 1 }
    PrincipalId:
      name: principal_id
      in: path
      required: true
      description: OIDC subject of the member.
      schema: { type: string, minLength: 1, maxLength: 255 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated unique key, 8-128 visible ASCII characters, retained 24h after terminal.
      schema: { type: string, minLength: 8, maxLength: 128 }
  responses:
    Unauthorized:
      description: Missing or invalid authentication.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authenticated but not permitted.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found in this tenant.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: State, uniqueness or idempotency conflict.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unprocessable:
      description: Semantically invalid (graph, versions, schema, limits).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Rate limit exceeded.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
              description: Stable machine-readable code, e.g. `execution_terminal`, `idempotency_conflict`, `invalid_graph`.
            message: { type: string }
            details:
              type: object
              additionalProperties: true
            request_id: { type: string }
    Organization:
      type: object
      required: [id, name, slug, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        created_at: { type: string, format: date-time }
    OrganizationCreate:
      type: object
      required: [name, slug]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        slug: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,62}$' }
    Member:
      type: object
      required: [principal_id, role, created_at]
      properties:
        principal_id: { type: string }
        role: { $ref: '#/components/schemas/MemberRole' }
        created_at: { type: string, format: date-time }
    MemberRole:
      type: string
      enum: [owner, operator, viewer]
    MemberCreate:
      type: object
      required: [principal_id, role]
      additionalProperties: false
      properties:
        principal_id: { type: string, minLength: 1, maxLength: 255 }
        role: { $ref: '#/components/schemas/MemberRole' }
    MemberUpdate:
      type: object
      required: [role]
      additionalProperties: false
      properties:
        role: { $ref: '#/components/schemas/MemberRole' }
    Project:
      type: object
      required: [id, org_id, name, slug, created_at]
      properties:
        id: { type: string }
        org_id: { type: string }
        name: { type: string }
        slug: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ProjectCreate:
      type: object
      required: [name, slug]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        slug: { type: string, pattern: '^[a-z][a-z0-9-]{1,62}$' }
    Agent:
      type: object
      required: [id, org_id, project_id, name, latest_version, created_at]
      properties:
        id: { type: string }
        org_id: { type: string }
        project_id: { type: string }
        name: { type: string }
        description: { type: [string, 'null'] }
        latest_version: { type: integer }
        deployed_version:
          type: [integer, 'null']
          description: The published version currently deployed. Publishing an older published version rolls back.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AgentCreate:
      type: object
      required: [name, version]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
        version: { $ref: '#/components/schemas/AgentVersionCreate' }
    AgentVersion:
      type: object
      required: [id, agent_id, version, status, digest, spec, runtime_abi, created_at]
      properties:
        id: { type: string }
        agent_id: { type: string }
        version: { type: integer }
        status: { $ref: '#/components/schemas/VersionStatus' }
        digest: { type: string, description: 'sha256:<hex> over canonical JSON of the spec + runtime ABI.' }
        spec: { $ref: '#/components/schemas/AgentSpec' }
        runtime_abi: { type: integer, minimum: 1 }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        published_at: { type: [string, 'null'], format: date-time }
    AgentVersionCreate:
      type: object
      required: [spec]
      additionalProperties: false
      properties:
        spec: { $ref: '#/components/schemas/AgentSpec' }
    AgentSpec:
      type: object
      required: [model, instructions, runtime]
      additionalProperties: false
      properties:
        model:
          type: object
          required: [provider, name, credential_ref]
          additionalProperties: false
          properties:
            provider: { type: string, minLength: 1 }
            name: { type: string, minLength: 1 }
            credential_ref: { type: string, description: Project credential name; never a secret value. }
            parameters:
              type: object
              additionalProperties: true
        instructions:
          type: string
          minLength: 1
          maxLength: 200000
        tools:
          type: array
          maxItems: 64
          items: { $ref: '#/components/schemas/ToolBinding' }
        runtime:
          type: object
          required: [abi_version, image_digest]
          additionalProperties: false
          properties:
            abi_version: { type: integer, minimum: 1 }
            image_digest: { type: string, pattern: '^sha256:[a-f0-9]{64}$' }
        limits:
          type: object
          additionalProperties: false
          properties:
            max_turns: { type: integer, minimum: 1, maximum: 1000 }
            timeout_seconds: { type: integer, minimum: 1, maximum: 86400 }
        checkpoint:
          type: object
          additionalProperties: false
          properties:
            mode: { type: string, enum: [none, on_node_end], default: on_node_end }
            require_checkpoint: { type: boolean }
        output_schema:
          type: object
          additionalProperties: true
          description: Optional JSON Schema for the node output.
        orchestration:
          $ref: '#/components/schemas/AgentOrchestration'
        mcp_servers:
          type: array
          maxItems: 16
          items: { $ref: '#/components/schemas/MCPServer' }
    ToolBinding:
      type: object
      required: [tool_id, version]
      additionalProperties: false
      properties:
        tool_id: { type: string }
        version: { type: integer, minimum: 1 }
        config:
          type: object
          additionalProperties: true
        policy: { $ref: '#/components/schemas/ToolPolicy' }
    ToolPolicy:
      type: object
      additionalProperties: false
      properties:
        permissions: { $ref: '#/components/schemas/ToolPermissions' }
        timeout_seconds: { type: number, exclusiveMinimum: 0, maximum: 300 }
        concurrency_limit: { type: integer, minimum: 1, maximum: 100 }
        auth_scope: { type: string, maxLength: 120 }
        max_retries: { type: integer, minimum: 0, maximum: 5 }
        idempotency: { type: string, enum: [required, optional] }
        requires_approval: { type: boolean }
    ToolPermissions:
      type: object
      additionalProperties: false
      properties:
        read: { type: boolean, default: true }
        write: { type: boolean, default: false }
        destructive: { type: boolean, default: false }
        network: { type: boolean, default: false }
    AgentOrchestration:
      type: object
      required: [allowed_agents]
      additionalProperties: false
      properties:
        allowed_agents:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: '#/components/schemas/AllowedAgent' }
        max_children: { type: integer, minimum: 1, maximum: 500 }
        max_depth: { type: integer, minimum: 1, maximum: 32 }
        max_parallel: { type: integer, minimum: 1, maximum: 100 }
        max_total_tokens: { type: integer, minimum: 1 }
        max_duration_seconds: { type: integer, minimum: 1, maximum: 604800 }
        max_retries: { type: integer, minimum: 0, maximum: 10 }
    AllowedAgent:
      type: object
      required: [agent_id, version]
      additionalProperties: false
      properties:
        agent_id: { type: string, pattern: '^agt_' }
        version: { type: integer, minimum: 1 }
        name: { type: string }
    MCPServer:
      type: object
      required: [name, transport]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        transport: { type: string, enum: [stdio, streamable_http] }
        command: { type: string }
        args:
          type: array
          maxItems: 50
          items: { type: string }
        env:
          type: object
          maxProperties: 32
          additionalProperties: { type: string, maxLength: 4096 }
        url: { type: string, format: uri }
        timeout_seconds: { type: number, exclusiveMinimum: 0, maximum: 300 }
        auth_credential_ref: { type: string, maxLength: 120 }
        tool_policies:
          type: object
          additionalProperties: { $ref: '#/components/schemas/ToolPolicy' }
    Workflow:
      type: object
      required: [id, org_id, project_id, name, latest_version, created_at]
      properties:
        id: { type: string }
        org_id: { type: string }
        project_id: { type: string }
        name: { type: string }
        description: { type: [string, 'null'] }
        latest_version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    WorkflowCreate:
      type: object
      required: [name, version]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
        version: { $ref: '#/components/schemas/WorkflowVersionCreate' }
    WorkflowVersion:
      type: object
      required: [id, workflow_id, version, status, digest, graph, created_at]
      properties:
        id: { type: string }
        workflow_id: { type: string }
        version: { type: integer }
        status: { $ref: '#/components/schemas/VersionStatus' }
        digest: { type: string }
        graph: { $ref: '#/components/schemas/WorkflowGraph' }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        published_at: { type: [string, 'null'], format: date-time }
    WorkflowVersionCreate:
      type: object
      required: [graph]
      additionalProperties: false
      properties:
        graph: { $ref: '#/components/schemas/WorkflowGraph' }
    WorkflowGraph:
      type: object
      required: [nodes, edges]
      additionalProperties: false
      properties:
        nodes:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/WorkflowNode' }
        edges:
          type: array
          maxItems: 2000
          items: { $ref: '#/components/schemas/WorkflowEdge' }
        policy:
          type: object
          additionalProperties: false
          properties:
            on_failure: { type: string, enum: [fail_fast, continue], default: fail_fast }
            retry: { $ref: '#/components/schemas/RetryPolicy' }
        input_schema:
          type: object
          additionalProperties: true
          description: Optional JSON Schema for execution input.
    WorkflowNode:
      type: object
      required: [id, type]
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,63}$'
        type:
          type: string
          enum: [start, end, agent, llm, tool, condition, transform, parallel, join, delay, approval, subworkflow, loop]
        agent:
          type: object
          required: [agent_id, version]
          additionalProperties: false
          properties:
            agent_id: { type: string, pattern: '^agt_' }
            version: { type: integer, minimum: 1 }
          description: Required when type=agent; exact version, no "latest".
        tool:
          type: object
          required: [tool_id, version]
          additionalProperties: false
          properties:
            tool_id: { type: string }
            version: { type: integer, minimum: 1 }
          description: Required when type=tool.
        params:
          type: object
          additionalProperties: true
        config:
          type: object
          additionalProperties: true
          description: Type-specific control-node configuration (expression, mapping, join, delay, approval, workflow, loop, input, output_from).
        input_schema:
          type: object
          additionalProperties: true
          description: Optional JSON Schema for the resolved node input.
        input_from:
          type: array
          uniqueItems: true
          maxItems: 16
          items: { type: string }
          description: Upstream node IDs whose outputs are passed to this node (max 16, total inline context ≤2 MiB).
        resources:
          type: object
          additionalProperties: false
          properties:
            cpu_cores: { type: number, exclusiveMinimum: 0, maximum: 1024 }
            memory_mb: { type: integer, minimum: 16, maximum: 1048576 }
        worker_pool: { type: [string, 'null'], description: Optional worker pool/placement constraint. }
        timeout_seconds: { type: integer, minimum: 1, maximum: 86400, default: 600 }
        retry:
          $ref: '#/components/schemas/RetryPolicy'
        side_effect_class:
          type: string
          enum: [read_only, idempotent, non_idempotent]
          default: read_only
        idempotency_key:
          type: string
          description: Required for idempotent side effects unless the tool declares a default. CEL expression.
        checkpoint_mode:
          type: string
          enum: [none, on_node_end, inherit]
          default: inherit
        require_checkpoint: { type: boolean, default: false }
        output_schema:
          type: object
          additionalProperties: true
    WorkflowEdge:
      type: object
      required: [from, to]
      additionalProperties: false
      properties:
        from: { type: string }
        to: { type: string }
        when:
          type: string
          maxLength: 2000
          description: Optional CEL boolean over input, outputs, params, execution, iteration and previous. Omitted means true.
        data_mapping:
          type: object
          additionalProperties: { type: string }
          description: Target dotted path to a CEL expression over the upstream execution context.
        priority: { type: integer, minimum: -100, maximum: 100, default: 0 }
    RetryPolicy:
      type: object
      additionalProperties: false
      properties:
        max_attempts: { type: integer, minimum: 1, maximum: 10, default: 1 }
        retry_on:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [transient, timeout, worker_lost, result_invalid, cancelled, any]
          default: [transient, timeout, worker_lost]
        backoff_base_ms: { type: integer, minimum: 100, maximum: 60000, default: 1000 }
        backoff_max_ms: { type: integer, minimum: 100, maximum: 600000, default: 60000 }
    VersionStatus:
      type: string
      enum: [draft, published, deprecated]
    ExecutionState:
      type: string
      enum: [pending, running, failing, cancel_requested, succeeded, failed, cancelled]
    TaskState:
      type: string
      enum: [pending, assigned, running, succeeded, failed, cancelled, skipped]
    ExecutionCreate:
      type: object
      required: [workflow_id, workflow_version, input]
      additionalProperties: false
      properties:
        workflow_id: { type: string, pattern: '^wf_' }
        workflow_version: { type: integer, minimum: 1 }
        input:
          type: object
          additionalProperties: true
          description: Immutable execution input, max 256 KiB serialized.
        deadline_at:
          type: [string, 'null']
          format: date-time
          description: Optional absolute deadline. Omitted means no execution-level deadline.
        priority:
          type: integer
          minimum: -100
          maximum: 100
          default: 0
          description: |
            Scheduling priority. Higher runs first within a tenant. Aging adds one effective point per minute
            waited, so low-priority work cannot starve permanently.
    Execution:
      type: object
      required: [id, org_id, project_id, workflow_id, workflow_version_id, workflow_version, state, state_version, counts, created_at]
      properties:
        id: { type: string }
        org_id: { type: string }
        project_id: { type: string }
        workflow_id: { type: string }
        workflow_version_id: { type: string }
        workflow_version: { type: integer }
        state: { $ref: '#/components/schemas/ExecutionState' }
        state_version: { type: integer }
        priority: { type: integer, minimum: -100, maximum: 100 }
        counts: { $ref: '#/components/schemas/ExecutionCounts' }
        input_digest: { type: string }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, 'null'], format: date-time }
        ended_at: { type: [string, 'null'], format: date-time }
        deadline_at: { type: [string, 'null'], format: date-time }
        cancel_reason: { type: [string, 'null'], enum: [user, deadline, null] }
        failure_code: { type: [string, 'null'] }
        failure_detail: { type: [string, 'null'] }
    ExecutionCounts:
      type: object
      required: [total, pending, assigned, running, succeeded, failed, cancelled, skipped]
      properties:
        total: { type: integer }
        pending: { type: integer }
        assigned: { type: integer }
        running: { type: integer }
        succeeded: { type: integer }
        failed: { type: integer }
        cancelled: { type: integer }
        skipped: { type: integer }
    Task:
      type: object
      required: [id, execution_id, node_id, node_type, state, state_version, attempt_count, max_attempts, created_at]
      properties:
        id: { type: string }
        execution_id: { type: string }
        node_id: { type: string }
        node_type:
          type: string
          enum: [start, end, agent, llm, tool, condition, transform, parallel, join, delay, approval, subworkflow, loop]
        state: { $ref: '#/components/schemas/TaskState' }
        state_version: { type: integer }
        priority: { type: integer, minimum: -100, maximum: 100 }
        attempt_count: { type: integer }
        max_attempts: { type: integer }
        agent_version_id: { type: [string, 'null'] }
        tool_version_id: { type: [string, 'null'] }
        skip_reason: { type: [string, 'null'], enum: [branch_not_taken, upstream_not_taken, dependency_failed, null] }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, 'null'], format: date-time }
        ended_at: { type: [string, 'null'], format: date-time }
    TaskDetail:
      allOf:
        - $ref: '#/components/schemas/Task'
        - type: object
          required: [attempts]
          properties:
            attempts:
              type: array
              items: { $ref: '#/components/schemas/TaskAttempt' }
            result:
              oneOf:
                - $ref: '#/components/schemas/TaskResult'
                - type: 'null'
              description: Present for terminal tasks while the inline result is within retention. Large artifact bytes are not downloadable through this initial contract; metadata is returned.
    TaskResult:
      type: object
      required: [outcome]
      properties:
        outcome: { type: string, enum: [succeeded, failed, cancelled] }
        output:
          type: [object, 'null']
          additionalProperties: true
          description: Inline output (required for success, may be empty) used by routing edges and the UI. Null after payload retention or for failed/cancelled attempts without output.
        output_artifact:
          oneOf:
            - $ref: '#/components/schemas/ArtifactMeta'
            - type: 'null'
        checkpoint:
          oneOf:
            - $ref: '#/components/schemas/CheckpointMeta'
            - type: 'null'
        error_code: { type: [string, 'null'] }
        error_message: { type: [string, 'null'] }
    ArtifactMeta:
      type: object
      required: [sha256, size_bytes]
      properties:
        sha256: { type: string }
        size_bytes: { type: integer }
        content_type: { type: [string, 'null'] }
    CheckpointMeta:
      type: object
      required: [id, sha256, size_bytes, created_at]
      properties:
        id: { type: string }
        sha256: { type: string }
        size_bytes: { type: integer }
        checkpoint_schema_version: { type: integer }
        created_at: { type: string, format: date-time }
    Environment:
      type: object
      required: [id, org_id, project_id, name, slug, kind, created_at, updated_at]
      properties:
        id: { type: string }
        org_id: { type: string }
        project_id: { type: string }
        name: { type: string }
        slug: { type: string }
        kind: { type: string, enum: [development, staging, production] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    APIKey:
      type: object
      required: [id, org_id, name, key_prefix, role, created_by, created_at]
      properties:
        id: { type: string }
        org_id: { type: string }
        project_id: { type: [string, 'null'] }
        name: { type: string }
        key_prefix: { type: string }
        role: { type: string, enum: [viewer, operator, owner] }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        last_used_at: { type: [string, 'null'], format: date-time }
        expires_at: { type: [string, 'null'], format: date-time }
        revoked_at: { type: [string, 'null'], format: date-time }
        key: { type: string, description: Present only in the create response. }
    Tool:
      type: object
      required: [tool_id, name, version, description, source]
      properties:
        tool_id: { type: string }
        name: { type: string }
        version: { type: integer }
        description: { type: string }
        source: { type: string, enum: [builtin, mcp] }
        schema: { type: object, additionalProperties: true }
    UsageProject:
      type: object
      required: [project_id, executions, succeeded, failed, attempts, tokens_in, tokens_out, duration_ms]
      properties:
        project_id: { type: string }
        executions: { type: integer }
        succeeded: { type: integer }
        failed: { type: integer }
        attempts: { type: integer }
        tokens_in: { type: integer }
        tokens_out: { type: integer }
        duration_ms: { type: integer }
    Usage:
      type: object
      required: [from, to, projects, total]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        projects:
          type: array
          items: { $ref: '#/components/schemas/UsageProject' }
        total: { $ref: '#/components/schemas/UsageProject' }
    MCPServerView:
      type: object
      required: [name, transport, agents]
      properties:
        name: { type: string }
        transport: { type: string, enum: [stdio, streamable_http] }
        command: { type: string }
        args:
          type: array
          items: { type: string }
        url: { type: string }
        auth_credential_ref: { type: string }
        tool_policies: { type: object, additionalProperties: true }
        agents:
          type: array
          items:
            type: object
            required: [agent_id, agent_name, version]
            properties:
              agent_id: { type: string }
              agent_name: { type: string }
              version: { type: integer }
    Delegation:
      type: object
      required: [id, root_execution_id, parent_execution_id, parent_task_id, child_execution_id,
                 agent_id, agent_version, status, created_at]
      properties:
        id: { type: string }
        root_execution_id: { type: string }
        parent_execution_id: { type: string }
        parent_task_id: { type: string }
        child_execution_id: { type: string }
        agent_id: { type: string }
        agent_version: { type: integer }
        status: { type: string, enum: [pending, running, succeeded, failed, cancelled] }
        error_code: { type: [string, 'null'] }
        error_message: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
    Approval:
      type: object
      required: [id, task_id, prompt, policy, approvers, status, requested_at, decisions]
      properties:
        id: { type: string }
        task_id: { type: string }
        prompt: { type: string }
        policy: { type: string, enum: [any, all] }
        approvers:
          type: array
          maxItems: 20
          items: { type: string }
        status: { type: string, enum: [pending, approved, rejected, expired] }
        requested_at: { type: string, format: date-time }
        expires_at: { type: [string, 'null'], format: date-time }
        decided_at: { type: [string, 'null'], format: date-time }
        decided_by: { type: [string, 'null'] }
        reason: { type: [string, 'null'] }
        decisions:
          type: array
          items: { $ref: '#/components/schemas/ApprovalDecision' }
    ApprovalDecision:
      type: object
      required: [id, approval_id, actor, decision, comment, created_at]
      properties:
        id: { type: string }
        approval_id: { type: string }
        actor: { type: string }
        decision: { type: string, enum: [approve, reject, expire] }
        comment: { type: string }
        created_at: { type: string, format: date-time }
    TaskAttempt:
      type: object
      required: [id, task_id, attempt_number, worker_id, outcome, outcome_unknown, effect_uncertain, dispatched_at]
      properties:
        id: { type: string }
        task_id: { type: string }
        attempt_number: { type: integer }
        worker_id: { type: string, description: Opaque worker identifier. Lease IDs are never exposed. }
        outcome:
          type: [string, 'null']
          enum: [succeeded, failed, cancelled, lease_expired, incomplete, null]
        outcome_unknown: { type: boolean }
        effect_uncertain: { type: boolean }
        error_code: { type: [string, 'null'] }
        error_message: { type: [string, 'null'] }
        dispatched_at: { type: string, format: date-time }
        accepted_at: { type: [string, 'null'], format: date-time }
        started_at: { type: [string, 'null'], format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
        result_available: { type: boolean }
        checkpoint_available: { type: boolean }
        metrics:
          type: object
          additionalProperties: true
          description: Runtime metrics reported for the attempt, such as tokens and duration.
    Event:
      type: object
      required: [seq, event_id, event_type, entity_type, entity_id, actor_type, actor_id, created_at]
      properties:
        seq: { type: integer, minimum: 1 }
        event_id: { type: string }
        event_type:
          type: string
          enum: [execution.created, execution.state_changed, task.state_changed, task.attempt_finished]
        entity_type: { type: string, enum: [execution, task, attempt] }
        entity_id: { type: string }
        actor_type: { type: string, enum: [user, system, worker] }
        actor_id: { type: string }
        from_state: { type: [string, 'null'] }
        to_state: { type: [string, 'null'] }
        reason: { type: [string, 'null'] }
        payload:
          type: object
          additionalProperties: true
        created_at: { type: string, format: date-time }
    WorkerStatus:
      type: string
      enum: [starting, available, busy, draining, unhealthy, terminated]
    Worker:
      type: object
      required: [id, pool, status, max_concurrency, available_slots, runtime, binary_version, last_heartbeat_at]
      properties:
        id: { type: string }
        pool: { type: string }
        status: { $ref: '#/components/schemas/WorkerStatus' }
        max_concurrency: { type: integer }
        available_slots: { type: integer }
        reserved_slots: { type: integer }
        runtime: { type: string }
        runtime_version: { type: string }
        binary_version: { type: string }
        cpu_cores: { type: number }
        cpu_usage_percent: { type: [number, 'null'] }
        memory_mb: { type: integer }
        memory_used_mb: { type: [integer, 'null'] }
        capabilities:
          type: array
          items: { type: string }
        last_heartbeat_at: { type: string, format: date-time }
    Credential:
      type: object
      required: [name, created_at]
      properties:
        name: { type: string }
        created_at: { type: string, format: date-time }
        rotated_at: { type: [string, 'null'], format: date-time }
    CredentialCreate:
      type: object
      required: [name, value]
      additionalProperties: false
      properties:
        name: { type: string, pattern: '^[a-z][a-z0-9_-]{0,63}$' }
        value: { type: string, minLength: 1, maxLength: 65536, writeOnly: true }

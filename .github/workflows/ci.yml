name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify modules
        run: go mod tidy && git diff --exit-code -- go.mod go.sum
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  python:
    name: Python
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [runtimes/python, sdk/python]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        working-directory: ${{ matrix.project }}
        run: uv sync --frozen
      - name: Lint
        working-directory: ${{ matrix.project }}
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        working-directory: ${{ matrix.project }}
        run: uv run mypy
      - name: Test
        working-directory: ${{ matrix.project }}
        run: uv run pytest

  web:
    name: Dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - name: Install
        working-directory: apps/dashboard
        run: npm ci
      - name: Lint and type check
        working-directory: apps/dashboard
        run: npm run lint
      - name: Build
        working-directory: apps/dashboard
        run: npm run build

  compose:
    name: Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: docker compose config --quiet

  manifests:
    name: Kubernetes and Helm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v4.3.2
      - name: Helm lint and render
        run: |
          helm lint infrastructure/helm/agent-platform
          helm template agent-platform infrastructure/helm/agent-platform --namespace agent-platform >/dev/null
      - name: Kustomize render
        run: kubectl kustomize infrastructure/kubernetes >/dev/null

  image-security:
    name: Image build and scan
    runs-on: ubuntu-latest
    needs: [go]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build images
        run: |
          docker build -f infrastructure/docker/go-service.Dockerfile --build-arg SERVICE=api --build-arg VERSION=ci -t agent-platform-api:ci .
          docker build -f infrastructure/docker/go-service.Dockerfile --build-arg SERVICE=orchestrator --build-arg VERSION=ci -t agent-platform-orchestrator:ci .
          docker build -f infrastructure/docker/worker.Dockerfile --build-arg VERSION=ci -t agent-platform-worker:ci .
          docker build -f infrastructure/docker/dashboard.Dockerfile --build-arg VERSION=ci -t agent-platform-dashboard:ci .
          docker build -f infrastructure/docker/cli.Dockerfile --build-arg VERSION=ci -t agent-platform-cli:ci .
          docker build -f infrastructure/docker/migrate.Dockerfile -t agent-platform-migrate:ci .
      - uses: aquasecurity/setup-trivy@v0.2.3
      - name: Scan HIGH and CRITICAL vulnerabilities
        run: |
          for image in api orchestrator worker dashboard cli migrate; do
            trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "agent-platform-${image}:ci"
          done

  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - uses: aquasecurity/setup-trivy@v0.2.3
      - name: Install dashboard dependencies
        working-directory: apps/dashboard
        run: npm ci
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run audit
        run: ./scripts/security-audit.sh

  integration:
    name: Integration (infrastructure)
    runs-on: ubuntu-latest
    needs: [go]
    env:
      # Avoid collisions with anything preinstalled on the runner.
      POSTGRES_PORT: 55432
      ORCHESTRATOR_GRPC_PORT: 19090
      ORCHESTRATOR_GRPC_ADDR: localhost:19090
      ORCHESTRATOR_NATS_URL: nats://platform:dev-nats-password@localhost:4222
      API_URL: http://localhost:8080
      API_RATE_LIMIT_PER_MINUTE: 1000
      API_DATABASE_URL: postgres://app_api:dev_api_password@localhost:55432/agent_platform?sslmode=disable
      ORCHESTRATOR_DATABASE_URL: postgres://app_orchestrator:dev_orchestrator_password@localhost:55432/agent_platform?sslmode=disable
      POSTGRES_DATABASE_URL: postgres://postgres:postgres@localhost:55432/agent_platform?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: astral-sh/setup-uv@v6
      - name: Sync Python runtime
        run: cd runtimes/python && uv sync --frozen
      - name: Start the control plane
        run: docker compose up -d --build postgres nats redis minio minio-init api orchestrator worker
      - name: Wait for the API
        run: |
          for _ in $(seq 1 90); do
            if curl -fsS http://localhost:8080/healthz >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "API did not become healthy" >&2
          docker compose logs --no-color
          exit 1
      - name: Run integration tests
        run: go test -tags=integration -count=1 ./tests/integration/...
      - name: Collect logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down -v --remove-orphans

# VPS / single-host deployment override (example).
#
#   cp infrastructure/compose/vps.override.example.yml infrastructure/compose/vps.override.yml
#   docker compose -f docker-compose.yml -f infrastructure/compose/vps.override.yml up -d --build
#
# Requires Docker Compose v2.24+ for `!reset`. The base file is the local development stack; this override
# removes every datastore port from the host so only the dashboard and API are reachable.
#
# Before exposing this host:
#   - change POSTGRES_PASSWORD and MINIO_* in .env (fresh volume only),
#   - set the public dashboard origin below,
#   - rotate the application role passwords (see docs/deployment.md#5-credentials),
#   - put TLS (Caddy, nginx, Traefik) in front of ports 3000 and 8080.

services:
  postgres:
    ports: !reset []
  nats:
    ports: !reset []
  redis:
    ports: !reset []
  minio:
    ports: !reset []
  orchestrator:
    ports: !reset []
    environment:
      # Optional operator surface; leave empty to disable it entirely.
      ORCHESTRATOR_ADMIN_TOKEN: ${ORCHESTRATOR_ADMIN_TOKEN:-}
  worker:
    ports: !reset []
  api:
    environment:
      API_CORS_ORIGINS: ${PUBLIC_DASHBOARD_ORIGIN:-http://localhost:3000}
      # Force OIDC on an exposed host. The API refuses to start without a real identity provider.
      AUTH_MODE: oidc
      AUTH_DEV_SECRET: ""
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:?set OIDC_ISSUER_URL for the VPS deployment}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?set OIDC_CLIENT_ID for the VPS deployment}
  dashboard:
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"

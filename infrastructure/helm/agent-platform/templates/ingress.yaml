{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "agent-platform.fullname" . }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tlsSecret }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: {service: {name: {{ include "agent-platform.fullname" . }}-api, port: {number: {{ .Values.api.service.port }}}}}
          - path: /
            pathType: Prefix
            backend: {service: {name: {{ include "agent-platform.fullname" . }}-dashboard, port: {number: 3000}}}
{{- end }}

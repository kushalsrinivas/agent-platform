{{- if .Values.serviceAccount.create }}
{{- range $name := list "api" "orchestrator" "worker" "dashboard" "migrate" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agent-platform.fullname" $ }}-{{ $name }}
  labels: {{- include "agent-platform.labels" $ | nindent 4 }}
  {{- with $.Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- end }}

# helm upgrade --install promtail grafana/promtail -n monitoring -f infrastructure/monitoring/loki/promtail-values.yaml
config:
  clients:
    - url: http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push
  snippets:
    pipelineStages:
      - cri: {}
      - json:
          expressions:
            level: level
            service: service
            request_id: request_id
      - labels:
          level:
          service:
      - match:
          selector: '{namespace="agent-platform"}'
          stages:
            - limit:
                rate: 2000
                burst: 4000
tolerations:
  - operator: Exists

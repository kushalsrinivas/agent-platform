apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: agent-platform
  labels: {app.kubernetes.io/name: api, app.kubernetes.io/part-of: agent-platform}
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app.kubernetes.io/name: api}
  template:
    metadata:
      labels: {app.kubernetes.io/name: api, app.kubernetes.io/part-of: agent-platform}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: api}
      containers:
        - name: api
          image: ghcr.io/your-org/agent-platform-api:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080}
          envFrom:
            - configMapRef: {name: agent-platform-config}
          env:
            - {name: API_DATABASE_URL, valueFrom: {secretKeyRef: {name: agent-platform-secrets, key: API_DATABASE_URL}}}
            - {name: API_ORCHESTRATOR_TOKEN, valueFrom: {secretKeyRef: {name: agent-platform-secrets, key: INTERNAL_API_TOKEN}}}
            - {name: SECRETS_MASTER_KEY, valueFrom: {secretKeyRef: {name: agent-platform-secrets, key: SECRETS_MASTER_KEY}}}
            - {name: SECRETS_ACTIVE_KEY_ID, valueFrom: {secretKeyRef: {name: agent-platform-secrets, key: SECRETS_ACTIVE_KEY_ID}}}
            - {name: SECRETS_PREVIOUS_KEYS, valueFrom: {secretKeyRef: {name: agent-platform-secrets, key: SECRETS_PREVIOUS_KEYS}}}
            - {name: OIDC_ISSUER_URL, valueFrom: {secretKeyRef: {name: agent-platform-secrets, key: OIDC_ISSUER_URL}}}
            - {name: OIDC_CLIENT_ID, valueFrom: {secretKeyRef: {name: agent-platform-secrets, key: OIDC_CLIENT_ID}}}
            - {name: OTEL_SERVICE_NAME, value: agent-platform-api}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 20
          lifecycle:
            preStop:
              exec: {command: [sh, -c, "sleep 5"]}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: agent-platform
  labels: {app.kubernetes.io/name: api, app.kubernetes.io/part-of: agent-platform}
spec:
  selector: {app.kubernetes.io/name: api}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: api, namespace: agent-platform}
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: api}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: agent-platform
  labels: {app.kubernetes.io/name: orchestrator, app.kubernetes.io/part-of: agent-platform}
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app.kubernetes.io/name: orchestrator}
  template:
    metadata:
      labels: {app.kubernetes.io/name: orchestrator, app.kubernetes.io/part-of: agent-platform}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: orchestrator
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: orchestrator}
      containers:
        - name: orchestrator
          image: ghcr.io/your-org/agent-platform-orchestrator:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - {name: grpc, containerPort: 9090}
            - {name: http, containerPort: 8081}
          envFrom:
            - configMapRef: {name: agent-platform-config}
          env:
            - {name: ORCHESTRATOR_DATABASE_URL, valueFrom: {secretKeyRef: {name: agent-platform-secrets, key: ORCHESTRATOR_DATABASE_URL}}}
            - {name: ORCHESTRATOR_NATS_URL, valueFrom: {secretKeyRef: {name: agent-platform-secrets, key: NATS_URL}}}
            - {name: ORCHESTRATOR_WORKER_TOKEN, valueFrom: {secretKeyRef: {name: agent-platform-secrets, key: WORKER_CONTROL_TOKEN}}}
            - {name: INTERNAL_API_TOKEN, valueFrom: {secretKeyRef: {name: agent-platform-secrets, key: INTERNAL_API_TOKEN}}}
            - {name: SECRETS_MASTER_KEY, valueFrom: {secretKeyRef: {name: agent-platform-secrets, key: SECRETS_MASTER_KEY}}}
            - {name: SECRETS_ACTIVE_KEY_ID, valueFrom: {secretKeyRef: {name: agent-platform-secrets, key: SECRETS_ACTIVE_KEY_ID}}}
            - {name: SECRETS_PREVIOUS_KEYS, valueFrom: {secretKeyRef: {name: agent-platform-secrets, key: SECRETS_PREVIOUS_KEYS}}}
            - {name: OTEL_SERVICE_NAME, value: agent-platform-orchestrator}
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "2", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: artifacts, mountPath: /var/lib/agent-platform/artifacts}
            - {name: tmp, mountPath: /tmp}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 20
          lifecycle:
            preStop:
              exec: {command: [sh, -c, "sleep 5"]}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 256Mi}
        - name: artifacts
          persistentVolumeClaim: {claimName: orchestrator-artifacts}
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator
  namespace: agent-platform
  labels: {app.kubernetes.io/name: orchestrator, app.kubernetes.io/part-of: agent-platform}
spec:
  selector: {app.kubernetes.io/name: orchestrator}
  ports:
    - {name: grpc, port: 9090, targetPort: grpc}
    - {name: http, port: 8081, targetPort: http}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: orchestrator, namespace: agent-platform}
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: orchestrator}

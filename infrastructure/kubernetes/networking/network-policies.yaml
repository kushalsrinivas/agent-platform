apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny-ingress, namespace: agent-platform}
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: api-ingress, namespace: agent-platform}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: api}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-nginx}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: dashboard}}
      ports: [{protocol: TCP, port: 8080}]
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: prometheus}}
      ports: [{protocol: TCP, port: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: orchestrator-ingress, namespace: agent-platform}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: orchestrator}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: api}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: python-worker}}
      ports: [{protocol: TCP, port: 9090}, {protocol: TCP, port: 8081}]
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: prometheus}}
      ports: [{protocol: TCP, port: 8081}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: worker-egress, namespace: agent-platform}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: python-worker}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: prometheus}}
      ports: [{protocol: TCP, port: 8082}]
  egress:
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: orchestrator}}
      ports: [{protocol: TCP, port: 9090}]
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: nats}}
      ports: [{protocol: TCP, port: 4222}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: otel-collector}}
      ports: [{protocol: TCP, port: 4318}]
    - to:
        - namespaceSelector: {}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: state-ingress, namespace: agent-platform}
spec:
  podSelector:
    matchExpressions:
      - {key: app.kubernetes.io/name, operator: In, values: [postgres, redis, minio, nats]}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: api}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: orchestrator}}
      ports:
        - {protocol: TCP, port: 5432}
        - {protocol: TCP, port: 6379}
        - {protocol: TCP, port: 9000}
        - {protocol: TCP, port: 4222}
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: python-worker}}
      ports:
        - {protocol: TCP, port: 4222}
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: prometheus}}
      ports:
        - {protocol: TCP, port: 5432}
        - {protocol: TCP, port: 6379}
        - {protocol: TCP, port: 9000}
        - {protocol: TCP, port: 4222}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: dashboard-ingress, namespace: agent-platform}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: dashboard}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-nginx}}
      ports: [{protocol: TCP, port: 3000}]
  egress:
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: api}}
      ports: [{protocol: TCP, port: 8080}]
    - to:
        - namespaceSelector: {}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]

apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-worker
  namespace: agent-platform
  labels: {app.kubernetes.io/name: python-worker, app.kubernetes.io/part-of: agent-platform}
spec:
  # KEDA owns the replica count when the ScaledObject is installed. A static replica keeps the base usable
  # before KEDA is present.
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app.kubernetes.io/name: python-worker}
  template:
    metadata:
      labels: {app.kubernetes.io/name: python-worker, app.kubernetes.io/part-of: agent-platform}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8082"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: worker
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: python-worker}
      containers:
        - name: worker
          image: ghcr.io/your-org/agent-platform-worker:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8082}
          envFrom:
            - configMapRef: {name: agent-platform-config}
          env:
            - name: WORKER_ID
              valueFrom:
                fieldRef: {fieldPath: metadata.name}
            - {name: WORKER_NATS_URL, valueFrom: {secretKeyRef: {name: agent-platform-secrets, key: NATS_URL}}}
            - {name: WORKER_CONTROL_TOKEN, valueFrom: {secretKeyRef: {name: agent-platform-secrets, key: WORKER_CONTROL_TOKEN}}}
            - {name: OTEL_SERVICE_NAME, value: agent-platform-worker}
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {cpu: "2", memory: 4Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: home, mountPath: /home/app}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 15
            periodSeconds: 20
          lifecycle:
            preStop:
              exec: {command: [sh, -c, "sleep 30"]}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 512Mi, medium: Memory}
        - name: home
          emptyDir: {sizeLimit: 64Mi}

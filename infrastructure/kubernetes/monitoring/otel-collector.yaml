apiVersion: v1
kind: ConfigMap
metadata: {name: otel-collector-config, namespace: monitoring}
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc: {endpoint: 0.0.0.0:4317}
          http: {endpoint: 0.0.0.0:4318}
      prometheus:
        config:
          scrape_configs:
            - job_name: agent-platform
              kubernetes_sd_configs:
                - role: pod
                  namespaces: {names: [agent-platform]}
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
                  action: keep
                  regex: "true"
                - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port]
                  action: replace
                  target_label: __address__
                  regex: (.+)
                  replacement: $1
                - source_labels: [__meta_kubernetes_pod_ip]
                  action: replace
                  target_label: __address__
                  regex: (.+)
                  replacement: $1:8080
    processors:
      batch: {}
      memory_limiter: {check_interval: 5s, limit_mib: 512}
      resourcedetection: {detectors: [env, system]}
    extensions:
      health_check: {endpoint: 0.0.0.0:13133}
    exporters:
      otlphttp/loki:
        endpoint: http://loki.monitoring.svc.cluster.local:3100/otlp
        tls: {insecure: true}
      prometheus:
        endpoint: 0.0.0.0:8889
    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resourcedetection, batch]
          exporters: [otlphttp/loki]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, resourcedetection, batch]
          exporters: [otlphttp/loki]
        metrics:
          receivers: [otlp, prometheus]
          processors: [memory_limiter, batch]
          exporters: [prometheus]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: otel-collector, namespace: monitoring, labels: {app.kubernetes.io/name: otel-collector}}
spec:
  replicaCount: 1
  selector: {matchLabels: {app.kubernetes.io/name: otel-collector}}
  template:
    metadata: {labels: {app.kubernetes.io/name: otel-collector}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.135.0
          args: [--config=/etc/otel/config.yaml]
          ports:
            - {name: otlp-grpc, containerPort: 4317}
            - {name: otlp-http, containerPort: 4318}
            - {name: prometheus, containerPort: 8889}
            - {name: health, containerPort: 13133}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "1", memory: 1Gi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: config, mountPath: /etc/otel}]
          readinessProbe: {httpGet: {path: /, port: 13133}}
          livenessProbe: {httpGet: {path: /, port: 13133}}
      volumes: [{name: config, configMap: {name: otel-collector-config}}]
---
apiVersion: v1
kind: Service
metadata: {name: otel-collector, namespace: monitoring}
spec:
  selector: {app.kubernetes.io/name: otel-collector}
  ports:
    - {name: otlp-grpc, port: 4317, targetPort: otlp-grpc}
    - {name: otlp-http, port: 4318, targetPort: otlp-http}
    - {name: prometheus, port: 8889, targetPort: prometheus}

# Copy to a private manifest or create with an external secret manager. Never commit real values.
apiVersion: v1
kind: Secret
metadata:
  name: agent-platform-secrets
  namespace: agent-platform
type: Opaque
stringData:
  API_DATABASE_URL: postgres://app_api:REPLACE_ME@postgres:5432/agent_platform?sslmode=require
  ORCHESTRATOR_DATABASE_URL: postgres://app_orchestrator:REPLACE_ME@postgres:5432/agent_platform?sslmode=require
  MIGRATE_CONTROL_DATABASE_URL: postgres://postgres:REPLACE_ME@postgres:5432/agent_platform?sslmode=require&x-migrations-table=control_schema_migrations
  MIGRATE_EXECUTION_DATABASE_URL: postgres://postgres:REPLACE_ME@postgres:5432/agent_platform?sslmode=require&x-migrations-table=execution_schema_migrations
  NATS_URL: nats://platform:REPLACE_ME@nats:4222
  SECRETS_MASTER_KEY: REPLACE_WITH_BASE64_32_BYTES
  SECRETS_ACTIVE_KEY_ID: primary
  SECRETS_PREVIOUS_KEYS: ""
  WORKER_CONTROL_TOKEN: REPLACE_ME
  INTERNAL_API_TOKEN: REPLACE_ME
  DASHBOARD_API_KEY: ""
  OIDC_ISSUER_URL: https://idp.example.com
  OIDC_CLIENT_ID: agent-platform-api

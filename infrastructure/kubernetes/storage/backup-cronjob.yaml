# Baseline logical backup to a PVC. Production must copy/ship this off-cluster and test restore regularly.
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: postgres-backups, namespace: agent-platform}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 20Gi}}
---
apiVersion: batch/v1
kind: CronJob
metadata: {name: postgres-backup, namespace: agent-platform}
spec:
  schedule: "15 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          securityContext: {runAsNonRoot: true, runAsUser: 999, runAsGroup: 999, fsGroup: 999, seccompProfile: {type: RuntimeDefault}}
          containers:
            - name: pg-dump
              image: postgres:16-alpine
              command: [sh, -c]
              args:
                - |
                  set -eu
                  stamp=$(date -u +%Y%m%dT%H%M%SZ)
                  pg_dump -h postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB" | gzip > "/backup/agent_platform-$stamp.sql.gz"
                  find /backup -type f -name '*.sql.gz' -mtime +14 -delete
              envFrom: [{secretRef: {name: postgres-secret}}]
              env:
                - {name: PGHOST, value: postgres}
                - {name: PGUSER, valueFrom: {secretKeyRef: {name: postgres-secret, key: POSTGRES_USER}}}
                - {name: PGPASSWORD, valueFrom: {secretKeyRef: {name: postgres-secret, key: POSTGRES_PASSWORD}}}
                - {name: PGDATABASE, valueFrom: {secretKeyRef: {name: postgres-secret, key: POSTGRES_DB}}}
              securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
              resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 500m, memory: 512Mi}}
              volumeMounts: [{name: backups, mountPath: /backup}]
          volumes: [{name: backups, persistentVolumeClaim: {claimName: postgres-backups}}]

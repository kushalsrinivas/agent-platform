# Single-node development storage for a self-contained cluster. Production should use managed PostgreSQL,
# NATS, Redis and object storage with backups and cross-AZ durability.
apiVersion: v1
kind: Secret
metadata: {name: postgres-secret, namespace: agent-platform}
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: REPLACE_ME
  POSTGRES_DB: agent_platform
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: agent-platform}
spec:
  selector: {app.kubernetes.io/name: postgres}
  ports: [{name: postgres, port: 5432, targetPort: postgres}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: postgres, namespace: agent-platform}
spec:
  serviceName: postgres
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: postgres}}
  template:
    metadata: {labels: {app.kubernetes.io/name: postgres}}
    spec:
      securityContext: {runAsNonRoot: true, fsGroup: 999, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{name: postgres, containerPort: 5432}]
          envFrom: [{secretRef: {name: postgres-secret}}]
          env:
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: "2", memory: 2Gi}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          readinessProbe: {exec: {command: [pg_isready, -U, postgres]}, periodSeconds: 5}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 20Gi}}}
---
apiVersion: v1
kind: Secret
metadata: {name: nats-secret, namespace: agent-platform}
type: Opaque
stringData:
  NATS_USER: platform
  NATS_PASSWORD: REPLACE_ME
---
apiVersion: v1
kind: Service
metadata: {name: nats, namespace: agent-platform}
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: nats}
  ports: [{name: client, port: 4222, targetPort: client}, {name: monitor, port: 8222, targetPort: monitor}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: nats, namespace: agent-platform}
spec:
  serviceName: nats
  replicas: 3
  podManagementPolicy: Parallel
  selector: {matchLabels: {app.kubernetes.io/name: nats}}
  template:
    metadata: {labels: {app.kubernetes.io/name: nats}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: nats
          image: nats:2.15-alpine
          command: [sh, -c]
          args:
            - exec nats-server -js -m 8222 --store_dir /data --user "$NATS_USER" --pass "$NATS_PASSWORD" --cluster_name agent-platform --cluster nats://0.0.0.0:6222 --routes nats://nats-0.nats:6222,nats://nats-1.nats:6222,nats://nats-2.nats:6222
          envFrom: [{secretRef: {name: nats-secret}}]
          ports: [{name: client, containerPort: 4222}, {name: monitor, containerPort: 8222}, {name: cluster, containerPort: 6222}]
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "1", memory: 1Gi}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          readinessProbe: {httpGet: {path: /healthz, port: monitor}, periodSeconds: 5}
          volumeMounts: [{name: data, mountPath: /data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 10Gi}}}
---
apiVersion: v1
kind: Service
metadata: {name: redis, namespace: agent-platform}
spec:
  selector: {app.kubernetes.io/name: redis}
  ports: [{name: redis, port: 6379, targetPort: redis}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: redis, namespace: agent-platform}
spec:
  serviceName: redis
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: redis}}
  template:
    metadata: {labels: {app.kubernetes.io/name: redis}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 999, fsGroup: 999, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: redis
          image: redis:8-alpine
          args: [redis-server, --appendonly, "yes"]
          ports: [{name: redis, containerPort: 6379}]
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: data, mountPath: /data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 5Gi}}}
---
apiVersion: v1
kind: Secret
metadata: {name: minio-secret, namespace: agent-platform}
type: Opaque
stringData:
  MINIO_ROOT_USER: minio
  MINIO_ROOT_PASSWORD: REPLACE_ME
---
apiVersion: v1
kind: Service
metadata: {name: minio, namespace: agent-platform}
spec:
  selector: {app.kubernetes.io/name: minio}
  ports: [{name: api, port: 9000, targetPort: api}, {name: console, port: 9001, targetPort: console}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: minio, namespace: agent-platform}
spec:
  serviceName: minio
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: minio}}
  template:
    metadata: {labels: {app.kubernetes.io/name: minio}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: minio
          image: pgsty/silo:RELEASE.2026-11-12T00-00-00Z
          args: [server, /data, --console-address, ":9001"]
          envFrom: [{secretRef: {name: minio-secret}}]
          ports: [{name: api, containerPort: 9000}, {name: console, containerPort: 9001}]
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "1", memory: 1Gi}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: data, mountPath: /data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 50Gi}}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: orchestrator-artifacts, namespace: agent-platform}
spec:
  accessModes: [ReadWriteMany]
  resources: {requests: {storage: 10Gi}}
